const KEY='moa2030_v2',OLD='moa2030_v1';
const fmt=n=>Math.round(Number(n)||0).toLocaleString('ko-KR')+'원',short=n=>(Number(n||0)/10000).toLocaleString('ko-KR',{maximumFractionDigits:1})+'만 원',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const sum=a=>a.reduce((p,n)=>p+(Number(n)||0),0);

 ['도약','청년도약계좌',700000,'목표저축','KB국민은행','도약'],
 ['청약','청년 주택드림 청약',250000,'목표저축','KB국민은행','청약'],

 ['비상','비상금',200000,'목적자금','OK저축은행 파킹통장','비상'],
 ['자동차','자동차보험·세금',100000,'목적자금','토스뱅크 모으기통장','자동차'],

 ['여행','해외여행',250000,'목적자금','토스뱅크 모으기통장','여행'],

 ['네이버','가족여행 적금',50000,'목적자금','우리은행 네이버페이통장','네이버']
];
const original=()=>({month:'2026-12',income:3120000,target:100000000,home:600000000,notes:'2030년 전후 개인 목표자금 1억, 두 사람 합산 2억, 대전 준신축 이상 6억 아파트.',plans:Object.fromEntries(specs.map(s=>[s[0],s[2]])),banks:Object.fromEntries(specs.map(s=>[s[0],s[4]])),balances:{도약:18200000,청약:8900000,추가적금:0,ISA:300000,고정:0,비상:0,자동차:0,경조사:0,여행:0,야구:0,스위스:0,네이버:0},checks:{},credits:{},transactions:[],notesByMonth:{},snapshots:[],nextId:1});
function migrate(o){let d=original();if(!o)return d;d.month=o.month||d.month;d.income=o.income||d.income;d.target=o.target||d.target;d.home=o.home||d.home;d.notes=(o.notes||d.notes).replaceAll('결혼·주택자금','목표자금');d.snapshots=Array.isArray(o.snapshots)?o.snapshots:[];d.transactions=Array.isArray(o.transactions)?o.transactions:[];d.nextId=Math.max(1,...d.transactions.map(x=>+x.id||0))+1;d.notesByMonth=o.checkNote||{};
let map={청년도약:'도약',청약:'청약','추가 적금':'추가적금',ISA:'ISA',비상금:'비상',자동차:'자동차',경조사:'경조사',여행:'여행',야구:'야구'};
if(Array.isArray(o.balances))o.balances.forEach(a=>{if(map[a.name])d.balances[map[a.name]]=Number(a.amount)||0});
if(Array.isArray(o.budgets)){const aliases={'청년도약계좌':'도약','청년 주택드림 청약':'청약','추가 고금리 적금':'추가적금','ISA · 미국배당다우존스':'배당','ISA · 미국나스닥100':'나스닥','고정지출 통장':'고정','비상금':'비상','자동차보험·세금':'자동차','경조사':'경조사','개인 해외여행':'여행','야구 직관·유니폼':'야구'};o.budgets.forEach(b=>{let id=aliases[b.name];if(id){d.plans[id]=Number(b.amount)||0;for(let [key,yes] of Object.entries(o.checks||{}))if(yes&&key.endsWith('_'+b.id)){let m=key.slice(0,7),ck=m+'|'+id;d.checks[ck]=true;d.credits[ck]=0}}})}
// 구버전은 잔액 수동관리였으므로 체크 기록을 옮기더라도 기존 잔액에 중복 가산하지 않음.
for(let s of specs)d.balances[s[5]] ??= 0;
return d}
let data;try{data=JSON.parse(localStorage.getItem(KEY));if(!data)data=migrate(JSON.parse(localStorage.getItem(OLD)||'null'))}catch{data=original()}
for(let k of ['plans','banks','balances','checks','credits'])data[k]??={};for(let s of specs){data.plans[s[0]]??=s[2];data.banks[s[0]]??=s[4];data.balances[s[5]]??=0}
let tab='대시보드';const save=()=>localStorage.setItem(KEY,JSON.stringify(data));save();const $=s=>document.querySelector(s);const tabs=['대시보드','월별 체크리스트','가계부','소비 분석','모으기 통장','자산·목표','설정'];
const ck=(m,id)=>m+'|'+id;const paid=(m,id)=>!!data.checks[ck(m,id)];const bal=(id)=>Number(data.balances[id]||0)+sum(Object.entries(data.credits).filter(([k])=>k.endsWith('|'+id)|| (id==='ISA'&&(k.endsWith('|배당')||k.endsWith('|나스닥')))).map(([,v])=>v));
// 기존 자산과 체크 입금은 따로 처리. 동일 체크는 크레딧을 한 번만 보유한다.
const actual=(id)=>{let n=Number(data.balances[id]||0);for(let [k,v] of Object.entries(data.credits)){let type=k.split('|')[1];let s=specs.find(x=>x[0]===type);if(s&&s[5]===id)n+=Number(v)||0}for(let t of data.transactions){if(t.account===id){n+=(t.type==='수입'?1:-1)*Number(t.amount||0)}}return n};
const targetNow=()=>sum(goals.map(actual));const totalNow=()=>sum([...new Set(specs.map(s=>s[5]))].map(actual));const expenses=()=>data.transactions.filter(t=>t.date.slice(0,7)===data.month&&t.type==='지출');const curr=()=>data.transactions.filter(t=>t.date.slice(0,7)===data.month);const planned=()=>sum(specs.map(s=>data.plans[s[0]]));
function heading(label,title){return `<div class="row" style="margin-bottom:18px;align-items:flex-start"><div><div class="eyebrow">${esc(label)}</div><h1>${esc(title)}</h1></div><input type="month" id="monthSelect" value="${esc(data.month)}" style="width:160px" aria-label="관리 월"></div>`}
function draw(){ $('#nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" data-tab="${t}">${t}</button>`).join('');$('#app').innerHTML=({'대시보드':dashboard,'월별 체크리스트':checklist,'가계부':ledger,'소비 분석':analysis,'모으기 통장':pockets,'자산·목표':assets,'설정':settings}[tab])();document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{tab=e.dataset.tab;draw()});bind()}
function dashboard(){let n=targetNow(),p=Math.max(0,Math.min(100,100*n/data.target)),completed=specs.filter(s=>paid(data.month,s[0])).length;return `${heading('OVERVIEW','나의 목표자금 다이어리')}<div class="grid"><section class="panel span8"><span class="muted small">현재 목표자금 · 계좌 입력값과 체크 반영액 기준</span><div class="big">${fmt(n)}</div><div class="progress"><div class="fill" style="width:${p}%"></div></div><div class="row"><b>1억 목표의 ${p.toFixed(1)}%</b><span class="muted small">목표 ${fmt(data.target)}</span></div><p class="hint">청년도약계좌·청약·추가 적금·ISA 합계. ISA ETF 평가손익은 자동 반영되지 않아요.</p></section><section class="panel span4"><h2>이번 달 납입 체크</h2><div class="big">${completed} / ${specs.length}</div><div class="progress"><div class="fill" style="width:${100*completed/specs.length}%"></div></div><button class="primary" onclick="go('월별 체크리스트')">체크하러 가기 →</button></section><section class="panel span4"><span class="muted small">월 실수령액</span><div class="kpi">${short(data.income)}</div><div class="row"><span>정기 배분</span><b>${short(planned())}</b></div><div class="row"><span>가용 생활비·주유비</span><b>${short(data.income-planned())}</b></div></section><section class="panel span4"><span class="muted small">이번 달 소비</span><div class="kpi">${short(sum(expenses().map(x=>x.amount)))}</div><button class="outline" onclick="go('소비 분석')">소비 분석 보기 →</button></section><section class="panel span4"><span class="muted small">목적자금 및 고정비 잔액</span><div class="kpi">${short(totalNow()-targetNow())}</div><button class="outline" onclick="go('모으기 통장')">모으기 통장 →</button></section><section class="panel span7"><h2>이번 달 배분 현황</h2>${[['목표저축','목표자금'],['목적자금','목적별 모으기'],['고정이체','고정지출']].map(([g,l])=>{let n=sum(specs.filter(s=>s[3]===g).map(s=>data.plans[s[0]]));return `<div class="goalbar"><span class="title">${l}</span><div class="bar"><div style="width:${100*n/data.income}%"></div></div><span class="value">${short(n)}</span></div>`}).join('')}<p class="hint">주유비·데이트·커피·식비·쇼핑은 체크리스트에 넣지 않고 가계부에서 기록해요.</p></section><section class="panel span5"><h2>중요 일정</h2><div class="itemrow"><b>2027.01.12 전후</b><div class="hint">ISA 연장 신청 기간 확인 (한국투자증권)</div></div><div class="itemrow"><b>2027.04.12</b><div class="hint">ISA 현 만기일</div></div><div class="itemrow"><b>2029.08.27</b><div class="hint">청년도약계좌 만기</div></div><div class="itemrow"><b>2030년 전후</b><div class="hint">개인 1억 · 합산 2억 · 대전 아파트 목표</div></div></section></div>`}
function checklist(){let done=specs.filter(s=>paid(data.month,s[0]));return `${heading('MONTHLY ROUTINE','월별 납입 체크리스트')}<div class="grid"><section class="panel span8"><div class="row"><h2>${esc(data.month)} 납입 계획</h2><span class="chip">${done.length}/${specs.length} 완료</span></div>${specs.map(s=>`<label class="checkitem ${paid(data.month,s[0])?'done':''}"><input type="checkbox" data-check="${s[0]}" ${paid(data.month,s[0])?'checked':''}><span style="flex:1"><strong>${esc(s[1])}</strong><div class="bank">${esc(data.banks[s[0]])}</div><span class="tag">${s[3]==='목표저축'?'목표자금':s[3]}</span></span><b class="number">${fmt(data.plans[s[0]])}</b></label>`).join('')}<div class="notice" style="margin-top:15px">체크하면 앱 안의 해당 잔액이 그 달 납입액만큼 증가해요. 체크 해제 시 증가분이 취소되고, 다른 달에 체크하면 그 달의 납입액이 별도로 반영돼요. <strong>실제 은행으로 자동이체되지는 않아요.</strong></div></section><section class="panel span4"><h2>이번 달 완료 금액</h2><div class="big">${short(sum(done.map(s=>data.credits[ck(data.month,s[0])]??data.plans[s[0]])))}</div><div class="row"><span>계획 합계</span><b>${short(planned())}</b></div><div class="row"><span>미완료 건수</span><b>${specs.length-done.length}건</b></div><h3>이번 달 메모</h3><textarea id="monthMemo" rows="8" placeholder="이번 달 자산관리 메모">${esc(data.notesByMonth[data.month]||'')}</textarea><button id="saveMemo" class="outline" style="margin-top:8px">메모 저장</button></section></div>`}
const cats=['데이트','커피','식비','쇼핑','교통·주유','여행','야구','자동차','경조사','통신·구독','보험·의료','기타'];
function ledger(){let trs=[...curr()].sort((a,b)=>b.date.localeCompare(a.date));let n=sum(expenses().map(x=>x.amount));return `${heading('CASHBOOK','가계부')}<div class="grid"><section class="panel span12"><div class="row"><b>이번 달 소비 ${fmt(n)}</b><span class="muted small">목표저축 납입 체크는 소비로 계산하지 않아요.</span></div></section><section class="panel span5"><h2>내역 입력</h2><form id="txForm" class="stack"><div class="formgrid"><div class="field wide"><label>날짜</label><input required type="date" name="date" value="${data.month===now().slice(0,7)?now():data.month+'-01'}"></div><div class="field wide"><label>구분</label><select name="type"><option>지출</option><option>수입</option></select></div><div class="field wide"><label>카테고리</label><select name="category">${cats.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field wide"><label>금액 (원)</label><input required type="number" name="amount" min="1" step="1"></div><div class="field" style="grid-column:span 4"><label>지출 통장 연결 (선택)</label><select name="account"><option value="">연결 안 함 (일반 생활비)</option>${specs.filter(s=>s[3]==='목적자금').map(s=>`<option value="${s[5]}">${esc(s[1])} · ${esc(data.banks[s[0]])}</option>`).join('')}</select></div><div class="field" style="grid-column:span 4"><label>메모</label><input name="note" placeholder="커피, 기름값, 야구 티켓 등"></div></div><button class="primary">내역 추가</button></form><p class="hint">여행·야구 등의 모으기 통장에서 실제 지출했다면 해당 통장을 선택하세요. 가계부와 목적통장 잔액에 한 번만 반영돼요.</p></section><section class="panel span7"><h2>이번 달 카테고리별 소비</h2>${categoryBars(expenses())}</section><section class="panel span12"><h2>거래 내역</h2><div style="overflow:auto"><table><thead><tr><th>날짜</th><th>카테고리</th><th>내용</th><th>연결 통장</th><th>금액</th><th></th></tr></thead><tbody>${trs.map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.category)}</td><td>${esc(t.note)}</td><td>${esc(t.account||'일반')}</td><td class="${t.type==='지출'?'amount-neg':'amount-pos'}">${t.type==='지출'?'-':'+'}${fmt(t.amount)}</td><td><button class="pill" data-delete-tx="${t.id}">×</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">아직 내역이 없어요.</td></tr>'}</tbody></table></div></section></div>`}
function categoryBars(arr){let vals={};arr.forEach(t=>vals[t.category]=(vals[t.category]||0)+Number(t.amount));let ordered=Object.entries(vals).sort((a,b)=>b[1]-a[1]),tot=sum(ordered.map(x=>x[1]));return ordered.map(([k,v])=>`<div class="goalbar"><span class="title">${esc(k)}</span><div class="bar"><div style="width:${tot?v/tot*100:0}%"></div></div><span class="value">${short(v)}</span></div>`).join('')||'<div class="empty">소비 내역을 입력하면 이곳에서 보여요.</div>'}
function analysis(){let ex=expenses(),total=sum(ex.map(x=>x.amount)),by={};ex.forEach(t=>by[t.category]=(by[t.category]||0)+Number(t.amount));let rank=Object.entries(by).sort((a,b)=>b[1]-a[1]);let first=rank[0],prev=new Date(data.month+'-01T12:00:00');prev.setMonth(prev.getMonth()-1);let pm=`${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,'0')}`,last=sum(data.transactions.filter(t=>t.date.startsWith(pm)&&t.type==='지출').map(t=>t.amount));let months=Array.from({length:6},(_,i)=>{let dt=new Date(data.month+'-01T12:00:00');dt.setMonth(dt.getMonth()-5+i);let k=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;return [k,sum(data.transactions.filter(t=>t.date.startsWith(k)&&t.type==='지출').map(t=>t.amount))]});let max=Math.max(1,...months.map(x=>x[1]));return `${heading('SPENDING INSIGHTS','나의 월간 소비 분석')}<div class="grid"><section class="panel span12"><div class="statgrid"><div class="stat"><div class="muted small">이번 달 총 소비</div><div class="kpi">${short(total)}</div></div><div class="stat"><div class="muted small">지난달 대비</div><div class="kpi ${total>last?'amount-neg':'amount-pos'}">${total>=last?'+':'−'}${short(Math.abs(total-last))}</div></div><div class="stat"><div class="muted small">가장 많이 쓴 곳</div><div class="kpi">${first?esc(first[0]):'—'}</div><span class="small muted">${first?fmt(first[1]):'소비 기록 없음'}</span></div></div></section><section class="panel span7"><h2>어디에 가장 많이 썼을까?</h2>${categoryBars(ex)}${first?`<p class="notice">이번 달은 <b>${esc(first[0])}</b>에 전체 소비의 ${(first[1]/total*100).toFixed(1)}%를 사용했어요.</p>`:''}</section><section class="panel span5"><h2>최근 6개월 소비 추이</h2>${months.map(([m,n])=>`<div class="goalbar"><span class="title">${esc(m)}</span><div class="bar"><div style="width:${n/max*100}%"></div></div><span class="value">${short(n)}</span></div>`).join('')}<p class="hint">가계부에 직접 입력한 지출만 집계하며 저축 이체는 제외돼요.</p></section><section class="panel span12"><h2>월간 소비 점검</h2><p class="hint">이번 달 생활비·주유비로 배분 가능한 돈은 <b>${fmt(data.income-planned())}</b>이에요. 실제 가계부에 기록한 소비는 <b>${fmt(total)}</b>이에요. 고정지출 20만 원은 체크리스트에 별도 반영되므로 소비와 비교할 때 중복 여부를 확인해 주세요.</p><div class="notice">팁: 커피·데이트·쇼핑·주유비를 모두 가계부에 기록하면 이 화면에서 월별 소비 패턴을 비교할 수 있어요.</div></section></div>`}
function pockets(){let arr=specs.filter(s=>s[3]==='목적자금');return `${heading('SAVINGS POCKETS','모으기 통장')}<div class="grid">${arr.map(s=>`<section class="panel span4"><span class="bank">${esc(data.banks[s[0]])}</span><h2 style="margin:8px 0">${esc(s[1])}</h2><div class="big">${fmt(actual(s[5]))}</div><p class="small muted">매달 계획: ${fmt(data.plans[s[0]])}</p>${s[0]==='비상'?`<div class="progress"><div class="fill" style="width:${Math.max(0,Math.min(100,actual(s[5])/3000000*100))}%"></div></div><p class="hint">비상금 1차 목표: 300만 원</p>`:''}<div class="field"><label>실제 잔액으로 맞추기 (원)</label><input data-actual="${s[5]}" type="number" step="1" min="0" value="${Math.max(0,actual(s[5]))}"></div></section>`).join('')}<section class="panel span12"><div class="notice">체크리스트를 완료하면 앱의 잔액이 증가해요. 실제 계좌에서 돈이 이체되는 것은 아니에요. 가계부에서 연결 통장을 선택하고 지출을 기록하면 해당 잔액이 감소해요. 실제 잔액과 다르면 위에서 맞출 수 있어요.</div></section></div>`}
function assets(){let arr=specs.filter(s=>s[3]==='목표저축');return `${heading('ASSETS','자산·목표')}<div class="grid"><section class="panel span7"><h2>목표자금 보유 현황</h2>${[...new Set(arr.map(s=>s[5]))].map(id=>`<div class="itemrow row"><div><strong>${esc({도약:'청년도약계좌',청약:'주택드림 청약',추가적금:'추가 적금',ISA:'한국투자증권 ISA'}[id])}</strong><div class="small muted">${esc(data.banks[arr.find(s=>s[5]===id)[0]])}</div></div><input style="width:155px" type="number" data-actual="${id}" min="0" value="${Math.max(0,actual(id))}"></div>`).join('')}<div class="row" style="padding-top:17px"><b>목표자금 총액</b><b>${fmt(targetNow())}</b></div><p class="hint">ISA 보유 ETF의 평가금액은 증권사 앱을 보고 수정해 주세요. 체크리스트에서 ETF를 10만 원·15만 원씩 납입하면 두 항목 모두 ISA 잔액에 합산됩니다.</p></section><section class="panel span5"><h2>나의 목표</h2><div class="field"><label>개인 목표자금 (원)</label><input type="number" id="target" min="1" value="${data.target}"></div><div class="field" style="margin-top:12px"><label>희망 아파트 가격 (원)</label><input type="number" id="home" min="1" value="${data.home}"></div><button class="primary" id="saveGoal" style="margin-top:12px">저장</button><div class="progress"><div class="fill" style="width:${Math.min(100,100*targetNow()/data.target)}%"></div></div><b>${(100*targetNow()/data.target).toFixed(1)}% 달성</b></section><section class="panel span7"><h2>월별 자산 스냅샷</h2><button id="snapshot" class="primary">${esc(data.month)} 기록하기</button><table><thead><tr><th>월</th><th>목표자금</th><th>전체</th><th></th></tr></thead><tbody>${data.snapshots.slice().sort((a,b)=>b.month.localeCompare(a.month)).map(s=>`<tr><td>${esc(s.month)}</td><td>${fmt(s.invested)}</td><td>${fmt(s.total)}</td><td><button class="pill" data-delete-snap="${esc(s.month)}">×</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">기록이 없어요.</td></tr>'}</tbody></table></section><section class="panel span5"><h2>중요한 일정</h2><div class="itemrow"><b>2027.01.12 전후</b><div class="muted small">한국투자증권 ISA 연장 확인</div></div><div class="itemrow"><b>2027.04.12</b><div class="muted small">ISA 현재 만기</div></div><div class="itemrow"><b>2029.08.27</b><div class="muted small">청년도약계좌 만기</div></div><div class="itemrow"><b>2030년 전후</b><div class="muted small">개인 1억 · 합산 2억 · 대전 주택</div></div></section></div>`}
function settings(){return `${heading('SETTINGS','설정 및 월급 배분')}<div class="grid"><section class="panel span8"><h2>정기 납입액과 입금처</h2><p class="hint">변경한 납입액은 앞으로 체크할 항목에 적용돼요. 이미 체크한 달의 반영액은 유지돼요.</p><div style="overflow-x:auto"><table><thead><tr><th>항목</th><th>통장</th><th>월 금액</th></tr></thead><tbody>${specs.map(s=>`<tr><td>${esc(s[1])}</td><td><input style="min-width:170px" data-bank="${s[0]}" value="${esc(data.banks[s[0]])}"></td><td><input style="min-width:125px;width:125px" type="number" min="0" step="1000" data-plan="${s[0]}" value="${data.plans[s[0]]}"></td></tr>`).join('')}</tbody></table></div><div class="itemrow row"><b>정기 배분 총액</b><b>${fmt(planned())}</b></div><div class="itemrow row"><b>그 외 생활비·주유비</b><b>${fmt(data.income-planned())}</b></div><p class="hint">주유비는 정기 체크에 포함하지 않고 가계부에서 지출 기록으로 관리해요.</p></section><section class="panel span4"><h2>기본 정보</h2><div class="field"><label>월 실수령액 (원)</label><input type="number" id="income" value="${data.income}"></div><div class="field" style="margin-top:12px"><label>목표 메모</label><textarea id="goalsNote" rows="7">${esc(data.notes)}</textarea></div><button class="primary" id="saveSettings" style="margin-top:12px">기본 정보 저장</button><h3>데이터 관리</h3><button class="outline" id="exportAlt">JSON 백업</button><p class="hint">HTML을 복사해도 가계부 기록은 같이 복사되지 않아요. JSON 백업으로 옮겨 주세요.</p><button class="outline danger" id="reset">전체 초기화</button></section></div>`}
function bind(){let m=$('#monthSelect');if(m)m.onchange=()=>{data.month=m.value;save();draw()};document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{let id=e.dataset.check,key=ck(data.month,id);if(e.checked){data.checks[key]=true;data.credits[key]=Number(data.plans[id])||0}else{delete data.checks[key];delete data.credits[key]}save();draw()});document.querySelectorAll('[data-actual]').forEach(e=>e.onchange=()=>{let id=e.dataset.actual,v=Math.max(0,Number(e.value)||0),delta=v-actual(id);data.balances[id]=(Number(data.balances[id])||0)+delta;save();draw()});document.querySelectorAll('[data-plan]').forEach(e=>e.onchange=()=>{data.plans[e.dataset.plan]=Math.max(0,Number(e.value)||0);save();draw()});document.querySelectorAll('[data-bank]').forEach(e=>e.onchange=()=>{data.banks[e.dataset.bank]=e.value;save();draw()});let form=$('#txForm');if(form)form.onsubmit=e=>{e.preventDefault();let f=new FormData(form);data.transactions.push({id:data.nextId++,date:String(f.get('date')),type:String(f.get('type')),category:String(f.get('category')),amount:Number(f.get('amount')),note:String(f.get('note')||''),account:String(f.get('account')||'')});data.month=String(f.get('date')).slice(0,7);save();draw()};document.querySelectorAll('[data-delete-tx]').forEach(e=>e.onclick=()=>{if(confirm('이 내역을 삭제할까요? 연결 통장 잔액도 복구돼요.')){data.transactions=data.transactions.filter(t=>String(t.id)!==e.dataset.deleteTx);save();draw()}});let mn=$('#saveMemo');if(mn)mn.onclick=()=>{data.notesByMonth[data.month]=$('#monthMemo').value;save();alert('메모를 저장했어요.')};let g=$('#saveGoal');if(g)g.onclick=()=>{data.target=Math.max(1,Number($('#target').value)||1);data.home=Math.max(1,Number($('#home').value)||1);save();draw()};let ss=$('#saveSettings');if(ss)ss.onclick=()=>{data.income=Math.max(0,Number($('#income').value)||0);data.notes=$('#goalsNote').value;save();draw()};let sp=$('#snapshot');if(sp)sp.onclick=()=>{data.snapshots=data.snapshots.filter(s=>s.month!==data.month);data.snapshots.push({month:data.month,invested:targetNow(),total:totalNow()});save();draw();alert('저장했어요.')};document.querySelectorAll('[data-delete-snap]').forEach(e=>e.onclick=()=>{data.snapshots=data.snapshots.filter(s=>s.month!==e.dataset.deleteSnap);save();draw()});let ex=$('#exportAlt');if(ex)ex.onclick=backup;let reset=$('#reset');if(reset)reset.onclick=()=>{if(confirm('정말 모든 기록을 초기화할까요? 백업 없이 복구할 수 없어요.')){data=original();save();tab='대시보드';draw()}}}
function go(s){tab=s;draw();window.scrollTo(0,0)}function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='moa_2030_backup_'+now()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}$('#exportBtn').onclick=backup;$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{let next=JSON.parse(await f.text());if(!next.balances||!Array.isArray(next.transactions))throw Error('올바른 백업 파일이 아니에요.');if(confirm('현재 기록을 백업 데이터로 교체할까요?')){data=next.plans?next:migrate(next);save();draw()}}catch(err){alert('복구 실패: '+err.message)}e.target.value=''};draw();
</script></body></html>
